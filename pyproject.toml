[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "origin-ai"
version = "0.2.0"
description = "Local-first, modular personal AI assistant foundation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Douglas Nicolau Norberto" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "langchain>=0.3",
    "langchain-ollama>=0.2",
    "langchain-chroma>=0.1",
]

[project.scripts]
origin = "origin.app:run"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["origin*"]

[tool.setuptools.package-data]
"origin.prompts" = ["templates/*.md"]
"origin.web" = ["static/*"]
"origin.i18n" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires a running local Ollama server"]
filterwarnings = ["ignore::DeprecationWarning:chromadb.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
